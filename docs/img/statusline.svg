<g transform="translate(24.0,52.0) scale(1.45)"><rect x="0" y="-9.5" width="19.8" height="13.5" rx="2" fill="#e5c07b"/><text x="9.9" y="0" fill="#2e3440" font-size="11" font-weight="bold" text-anchor="middle" xml:space="preserve">2</text><rect x="27.8" y="-8" width="7" height="7" rx="1" fill="#f5a623"/><text x="41.8" y="0" fill="#e5c07b" font-size="11" font-weight="bold" text-anchor="start" xml:space="preserve">api</text><text x="68.2" y="0" fill="#e5c07b" font-size="11" text-anchor="start" xml:space="preserve">feat/auth-token</text><text x="173.2" y="0" fill="#5a5868" font-size="11" text-anchor="start" xml:space="preserve">│</text><text x="187.2" y="0" fill="#e8b450" font-size="11" text-anchor="start" xml:space="preserve">±172</text><text x="221.6" y="0" fill="#9ca2af" font-size="11" text-anchor="start" xml:space="preserve">↑3</text><text x="240.8" y="0" fill="#5a5868" font-size="11" text-anchor="start" xml:space="preserve">│</text><text x="254.8" y="0" fill="#98c379" font-size="11" font-weight="bold" text-anchor="start" xml:space="preserve">34%</text></g>
