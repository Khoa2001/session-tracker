<text x="407.8" y="118" fill="#9ca2af" font-size="12" text-anchor="start" xml:space="preserve">context used</text>
<text x="24.0" y="200" fill="#e0def4" font-size="12" text-anchor="start" xml:space="preserve">The percent changes color as the window fills:</text>
<text x="24.0" y="232" fill="#98c379" font-size="16" font-weight="bold" text-anchor="start" xml:space="preserve">7%</text>
