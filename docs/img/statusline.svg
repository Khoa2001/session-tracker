<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" font-family="Menlo, 'DejaVu Sans Mono', 'JetBrains Mono', monospace" role="img" aria-label="Anatomy of the status line: pane number, model glyph, repo and branch, changed lines, commits ahead, and context percent, followed by how it shortens in a narrow pane">
